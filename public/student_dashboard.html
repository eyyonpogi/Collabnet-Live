<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Student Portal - CollabNet</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Theme CSS -->
    <link href="/assets/css/collabnet-theme.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-10">

<div class="student-mobile-frame">
    <!-- Mobile App Header -->
    <div class="student-mobile-header">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <small class="text-white-50 text-uppercase fw-semibold" style="font-size: 0.65rem;">OLLCF Extension Portal</small>
                <h5 id="userName" class="fw-bold mb-0 text-white">Student</h5>
            </div>
            <div class="d-flex gap-2">
                <a href="/student_notifications.html" class="btn btn-sm btn-light text-primary rounded-circle position-relative d-inline-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                    <i class="bi bi-bell-fill"></i>
                    <span id="notifBadge" class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle d-none"></span>
                </a>
                <button id="logoutBtn" class="btn btn-sm btn-light text-primary rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                    <i class="bi bi-box-arrow-right"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Main Mobile Content Area -->
    <div class="p-3">
        <!-- Service Hours Tracker Widget Card -->
        <div class="student-action-card mb-3 bg-primary text-white border-0 shadow-sm">
            <div class="d-flex align-items-center justify-content-between mb-2">
                <div>
                    <span class="badge bg-light text-primary mb-1">Service Hours Tracker</span>
                    <h4 class="fw-extrabold mb-0"><span id="totalHours">0.00</span> <span class="fs-6 fw-normal text-white-50">hrs rendered</span></h4>
                </div>
                <div class="bg-white bg-opacity-20 p-2 rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
                    <i class="bi bi-clock-history fs-3 text-white"></i>
                </div>
            </div>
            <div class="pt-2 border-top border-white border-opacity-25 d-flex justify-content-between align-items-center" style="font-size: 0.75rem;">
                <span class="text-white-50"><i class="bi bi-check2-circle me-1"></i>Joined Programs:</span>
                <strong class="text-white"><span id="joinedCount">0</span> Activities</strong>
            </div>
        </div>

        <!-- Inline Notification Feedback -->
        <div id="alertContainer"></div>

        <!-- Section Header -->
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="fw-bold mb-0 text-dark">Recent Outreach Activities</h6>
            <a href="/student_activities.html" class="text-primary text-decoration-none fw-semibold small">See All</a>
        </div>

        <!-- Activity Cards Feed container -->
        <div id="activitiesContainer">
            <div class="text-center text-muted py-4 student-action-card">
                <div class="spinner-border text-primary spinner-border-sm mb-2" role="status"></div>
                <small class="d-block">Loading activities...</small>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom App Navigation -->
    <nav class="student-bottom-nav">
        <a href="/student_dashboard.html" class="student-nav-item active">
            <i class="bi bi-house-door-fill"></i>
            <span>Home</span>
        </a>
        <a href="/student_activities.html" class="student-nav-item">
            <i class="bi bi-calendar-week"></i>
            <span>Activities</span>
        </a>
        <a href="/student_attendance.html" class="student-nav-item">
            <i class="bi bi-clock"></i>
            <span>Attendance</span>
        </a>
        <a href="/student_profile.html" class="student-nav-item">
            <i class="bi bi-person"></i>
            <span>Profile</span>
        </a>
    </nav>
</div>

<!-- Schedule Conflict Error Pop-Up Modal -->
<div class="modal fade" id="conflictModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered px-3">
        <div class="modal-content border-0 shadow-lg rounded-4 text-center p-3">
            <div class="modal-body">
                <div class="text-danger mb-3">
                    <i class="bi bi-calendar-x-fill display-3"></i>
                </div>
                <h5 class="fw-bold text-dark mb-2">Schedule Conflict</h5>
                <p class="text-muted small mb-4" id="conflictModalMessage">You are already registered for another activity on this date.</p>
                <button type="button" class="btn btn-danger fw-bold px-4 py-2 rounded-pill w-100" data-bs-dismiss="modal">
                    Understand & Close
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
async function loadDashboard() {
    try {
        const response = await fetch('/api/student/dashboard');
        
        if (response.status === 401) {
            window.location.href = '/index.html';
            return;
        }

        const data = await response.json();
        
        if (!data.success) return;

        // Populate KPIs
        document.getElementById('totalHours').textContent = data.stats.totalHours.toFixed(2);
        document.getElementById('joinedCount').textContent = data.stats.joinedCount;

        // Toggle Notification Badge
        if (data.stats.unreadNotifications > 0) {
            document.getElementById('notifBadge').classList.remove('d-none');
        }

        // Render Activities List
        const container = document.getElementById('activitiesContainer');
        if (!data.activities || data.activities.length === 0) {
            container.innerHTML = `
                <div class="text-center text-muted py-4 student-action-card">
                    <i class="bi bi-calendar-x display-6 text-muted mb-2 d-block"></i>
                    <small>No community outreach activities posted yet.</small>
                </div>
            `;
            return;
        }

        container.innerHTML = data.activities.map(act => {
            const hasIn = Boolean(act.formatted_time_in);
            const hasOut = Boolean(act.formatted_time_out);
            const rendered = parseFloat(act.hours_rendered || 0);
            const target = parseFloat(act.estimated_hours || 0);
            const targetReached = act.target_reached === true || rendered >= target;

            let badgeHtml = '<span class="badge bg-light text-secondary border">Open</span>';
            if (act.is_joined) {
                if (hasIn && hasOut) {
                    badgeHtml = `
                        <span class="badge ${targetReached ? 'bg-success' : 'bg-warning text-dark'} rounded-pill" style="font-size: 0.65rem;">
                            <i class="bi ${targetReached ? 'bi-check-all' : 'bi-clock-history'} me-1"></i>
                            ${rendered.toFixed(2)} / ${target.toFixed(2)} hrs
                        </span>
                    `;
                } else {
                    badgeHtml = '<span class="cn-badge cn-badge-success"><i class="bi bi-check-circle-fill me-1"></i>Joined</span>';
                }
            }

            let actionHtml = '';
            if (act.is_joined) {
                actionHtml = `
                    <a href="/student_attendance.html" class="btn btn-sm btn-primary py-1 px-3 fw-bold" style="font-size: 0.7rem;">
                        <i class="bi bi-clock-history me-1"></i> Attendance
                    </a>
                `;
            } else {
                actionHtml = `
                    <button onclick="joinActivity(${act.activity_id})" class="btn btn-sm btn-outline-primary py-1 px-3 fw-bold" style="font-size: 0.7rem;">
                        <i class="bi bi-plus-circle me-1"></i> Join Activity
                    </button>
                `;
            }

            const formattedDate = act.target_date ? new Date(act.target_date).toISOString().split('T')[0] : 'N/A';

            return `
                <div class="student-action-card mb-2">
                    <div class="d-flex justify-content-between align-items-start mb-1">
                        <h6 class="fw-bold text-dark mb-0 text-truncate" style="max-width: 170px;">${act.title}</h6>
                        ${badgeHtml}
                    </div>
                    <p class="text-muted small mb-2 text-truncate" style="font-size: 0.8rem;">${act.description || 'No activity description provided.'}</p>
                    <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                        <div class="text-muted small" style="font-size: 0.75rem;">
                            <i class="bi bi-calendar-event me-1 text-primary"></i>
                            <span>${formattedDate}</span>
                        </div>
                        <div class="d-flex gap-1 align-items-center">
                            ${actionHtml}
                        </div>
                    </div>
                </div>
            `;
        }).join('');

    } catch (err) {
        console.error('Failed to load dashboard data:', err);
    }
}

// Join Activity Function with Pop-Up Conflict Handler
async function joinActivity(activityId) {
    try {
        const res = await fetch('/api/student/activities/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ activity_id: activityId, action: 'join' })
        });

        const data = await res.json();

        if (!res.ok) {
            // Trigger Bootstrap Pop-Up Modal for Schedule Conflict
            showConflictModal(data.error || 'Failed to join activity due to a schedule conflict.');
            return;
        }

        showAlert('success', data.message || 'Joined successfully!');
        loadDashboard(); // Refresh metrics and button state
    } catch (err) {
        console.error('Join Activity Error:', err);
        showConflictModal('Server connection failure. Please try again.');
    }
}

// Function to trigger pop-up error dialog
function showConflictModal(message) {
    document.getElementById('conflictModalMessage').textContent = message;
    const modalEl = document.getElementById('conflictModal');
    const modal = new bootstrap.Modal(modalEl);
    modal.show();
}

function showAlert(type, msg) {
    document.getElementById('alertContainer').innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show py-2 px-3 small mb-3" role="alert">
            <i class="bi ${type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'} me-1"></i>${msg}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
        </div>
    `;
}

// Handle Logout
document.getElementById('logoutBtn').addEventListener('click', async () => {
    await fetch('/api/auth/logout');
    window.location.href = '/index.html';
});

document.addEventListener('DOMContentLoaded', loadDashboard);
</script>
</body>
</html>
