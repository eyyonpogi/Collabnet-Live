<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - CollabNet</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Theme CSS -->
    <link href="/assets/css/collabnet-theme.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="landing-container py-4">
    <div class="hero-header text-center">
        <h1 class="brand-title mb-1">Collab<span class="brand-accent">Net</span></h1>
        <p class="brand-subtitle mb-0">Vinzons LGU & OLLCF Portal</p>
    </div>

    <div class="login-card-wrapper">
        <div class="login-card" style="max-width: 500px;">
            <h4 class="text-center fw-bold text-dark mb-1">Create Account</h4>
            <p class="text-center text-muted small mb-4">Student Portal Registration</p>

            <div id="errorAlert" class="alert alert-danger py-2 small mb-3 text-center d-none align-items-center justify-content-center gap-2">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span id="errorMessage"></span>
            </div>

            <form id="registerForm">
              <div class="mb-3">
                <label for="full_name" class="form-label fw-semibold">Full Name</label>
                <input type="text" id="full_name" class="form-control" placeholder="Juan Dela Cruz" required>
              </div>

              <div class="row g-2 mb-3">
                <div class="col-md-5">
                  <label for="student_id" class="form-label fw-semibold">Student ID</label>
                  <input type="text" id="student_id" class="form-control" placeholder="XX-XXXX" required>
                </div>
                <div class="col-md-7">
                  <label for="email" class="form-label fw-semibold">OLLCF Email Address</label>
                  <input type="email" id="email" class="form-control" placeholder="student@ollcf.edu.ph" required>
                </div>
              </div>

              <div class="mb-3">
                <label for="course" class="form-label fw-semibold">Academic Program (Course)</label>
                <select id="course" class="form-select" required>
                  <option value="" selected disabled>-- Select Your OLLCF Program --</option>
                  <optgroup label="College of Computer Studies">
                    <option value="BSIT">BSIT - BS Information Technology</option>
                    <option value="BSCS">BSCS - BS Computer Science</option>
                  </optgroup>
                  <optgroup label="College of Business Administration">
                    <option value="BSBA">BSBA - BS Business Administration</option>
                  </optgroup>
                  <optgroup label="College of Teacher Education">
                    <option value="BEEd">BEEd - Bachelor in Elementary Education</option>
                    <option value="BSEd">BSEd - Bachelor in Secondary Education</option>
                  </optgroup>
                  <optgroup label="College of Criminal Justice Education">
                    <option value="BSCrim">BSCrim - BS Criminology</option>
                  </optgroup>
                  <optgroup label="College of Hospitality Management">
                    <option value="BSHM">BSHM - BS Hospitality Management</option>
                  </optgroup>
                  <optgroup label="College of Maritime Education">
                    <option value="BSMT">BSMT - BS Marine Transportation</option>
                    <option value="BSMarE">BSMarE - BS Marine Engineering</option>
                  </optgroup>
                  <optgroup label="College of Nursing and Midwifery">
                    <option value="BSN">BSN - BS Nursing</option>
                    <option value="Midwifery">Midwifery - 2-year Diploma Program</option>
                  </optgroup>
                  <optgroup label="College of Medical Technology">
                    <option value="BS MedTech">BS MedTech - BS Medical Technology</option>
                  </optgroup>
                  <optgroup label="College of Psychology">
                    <option value="BSPsych">BSPsych - BS Psychology</option>
                  </optgroup>
                  <optgroup label="College of Law">
                    <option value="Juris Doctor">Juris Doctor (JD)</option>
                  </optgroup>
                </select>
              </div>

              <!-- Quick Student Verification Document Upload -->
              <div class="mb-3">
                <label for="verification_file" class="form-label fw-semibold">
                    Proof of Enrollment (School ID or COR) <span class="text-danger">*</span>
                </label>
                <input type="file" id="verification_file" class="form-control" accept="image/*,.pdf" required>
                <small class="text-muted d-block mt-1" style="font-size: 0.72rem;">
                    <i class="bi bi-shield-check text-primary me-1"></i>Upload a clear photo of your OLLCF School ID or current COR (JPG, PNG, or PDF, up to 20MB) for fast admin verification.
                </small>
                <div id="docPreviewBox" class="mt-2 d-none border rounded-3 p-2 bg-light text-center">
                    <img id="docImagePreview" src="" alt="ID Preview" class="img-fluid rounded d-none" style="max-height: 150px;">
                    <div id="docPdfPreview" class="d-none text-primary small fw-semibold py-2">
                        <i class="bi bi-file-earmark-pdf-fill fs-4 d-block"></i>
                        <span id="docPdfName">document.pdf</span>
                    </div>
                </div>
              </div>

              <!-- Password Input with Eye Icon -->
              <div class="mb-3">
                <label for="password" class="form-label fw-semibold">Password</label>
                <div class="input-group">
                  <input type="password" id="password" class="form-control" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('password', 'togglePasswordIcon')">
                    <i id="togglePasswordIcon" class="bi bi-eye-slash"></i>
                  </button>
                </div>
              </div>

              <!-- Confirm Password Input with Eye Icon -->
              <div class="mb-3">
                <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                <div class="input-group">
                  <input type="password" id="confirm_password" class="form-control" required>
                  <button class="btn btn-outline-secondary" type="button" onclick="togglePasswordVisibility('confirm_password', 'toggleConfirmPasswordIcon')">
                    <i id="toggleConfirmPasswordIcon" class="bi bi-eye-slash"></i>
                  </button>
                </div>
              </div>

              <button type="submit" id="registerBtn" class="btn btn-primary w-100 fw-bold py-2">Register Account</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="/index.html" class="text-decoration-none small text-muted">Already have an account? Log in</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/modal-alert.js"></script>

<script>
const MAX_UPLOAD_BYTES = 20 * 1024 * 1024; // 20 MB
let processedDocBase64 = null;
let processedDocName = null;

function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('bi-eye-slash', 'bi-eye');
    } else {
        input.type = 'password';
        icon.classList.replace('bi-eye', 'bi-eye-slash');
    }
}

// Handle Image Compression or PDF Base64 Conversion (up to 20MB)
document.getElementById('verification_file').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    const previewBox = document.getElementById('docPreviewBox');
    const imgPreview = document.getElementById('docImagePreview');
    const pdfPreview = document.getElementById('docPdfPreview');
    const errorAlert = document.getElementById('errorAlert');

    errorAlert.classList.add('d-none');
    errorAlert.classList.remove('d-flex');

    if (!file) {
        processedDocBase64 = null;
        processedDocName = null;
        previewBox.classList.add('d-none');
        return;
    }

    if (file.size > MAX_UPLOAD_BYTES) {
        showError('File size exceeds the 20MB limit. Please upload a smaller image or PDF.');
        e.target.value = '';
        processedDocBase64 = null;
        previewBox.classList.add('d-none');
        return;
    }

    processedDocName = file.name;
    previewBox.classList.remove('d-none');

    if (file.type.startsWith('image/')) {
        const reader = new FileReader();
        reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 1200;
                const scaleSize = img.width > MAX_WIDTH ? MAX_WIDTH / img.width : 1;
                canvas.width = img.width * scaleSize;
                canvas.height = img.height * scaleSize;

                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                processedDocBase64 = canvas.toDataURL('image/jpeg', 0.8);

                imgPreview.src = processedDocBase64;
                imgPreview.classList.remove('d-none');
                pdfPreview.classList.add('d-none');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    } else {
        const reader = new FileReader();
        reader.onload = (event) => {
            processedDocBase64 = event.target.result;
            document.getElementById('docPdfName').textContent = `${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
            pdfPreview.classList.remove('d-none');
            imgPreview.classList.add('d-none');
        };
        reader.readAsDataURL(file);
    }
});

function showError(msg) {
    const errorAlert = document.getElementById('errorAlert');
    document.getElementById('errorMessage').textContent = msg;
    errorAlert.classList.remove('d-none');
    errorAlert.classList.add('d-flex');
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  
  const full_name = document.getElementById('full_name').value.trim();
  const student_id = document.getElementById('student_id').value.trim();
  const email = document.getElementById('email').value.trim();
  const course = document.getElementById('course').value;
  const password = document.getElementById('password').value;
  const confirm_password = document.getElementById('confirm_password').value;
  const btn = document.getElementById('registerBtn');

  if (password !== confirm_password) {
    showError('Passwords do not match!');
    return;
  }

  if (!processedDocBase64) {
    showError('Please upload your School ID or COR document (up to 20MB).');
    return;
  }

  try {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner-border spinner-border-sm me-1"></span> Submitting Registration...`;

    const res = await fetch('/api/auth/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        full_name, 
        student_id, 
        email, 
        course, 
        password,
        verification_doc: processedDocBase64,
        verification_doc_name: processedDocName
      })
    });

    const contentType = res.headers.get('content-type');
    if (!contentType || !contentType.includes('application/json')) {
      if (res.status === 413) {
        showError('Uploaded file exceeds the server payload limit (20MB max).');
      } else {
        showError(`Server error (${res.status}). Please try again.`);
      }
      return;
    }

    const data = await res.json();

    if (res.ok) {
      const successMsg = data.message || 'Registration submitted! Awaiting admin verification.';
      if (typeof window.showPopupModal === 'function') {
        window.showPopupModal(successMsg, () => {
          window.location.href = '/index.html';
        });
      } else {
        alert(successMsg);
        window.location.href = '/index.html';
      }
    } else {
      showError(data.error || data.message || 'Registration failed.');
    }
  } catch (err) {
    console.error('Registration error:', err);
    showError('Server error submitting registration.');
  } finally {
    btn.disabled = false;
    btn.innerHTML = 'Register Account';
  }
});
</script>
</body>
</html>
