<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Extension Activities - CollabNet Student</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Theme CSS -->
    <link href="/assets/css/collabnet-theme.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-10">

<div class="student-mobile-frame">
    <!-- Mobile Header -->
    <div class="student-mobile-header">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <small class="text-white-50 text-uppercase fw-semibold" style="font-size: 0.65rem;">OLLCF Extension Office</small>
                <h5 class="fw-bold mb-0 text-white">Outreach Activities</h5>
            </div>
            <a href="/student_notifications.html" class="btn btn-sm btn-light text-primary rounded-circle d-inline-flex align-items-center justify-content-center" style="width: 36px; height: 36px;">
                <i class="bi bi-bell-fill"></i>
            </a>
        </div>
    </div>

    <!-- Content Area -->
    <div class="p-3">
        <!-- Alert Feedback -->
        <div id="alertContainer"></div>

        <!-- Filter Pills -->
        <div class="d-flex gap-2 mb-3 overflow-x-auto pb-1">
            <button class="btn btn-sm btn-primary rounded-pill px-3 fw-bold active" id="filterAll" onclick="filterActivities('all')">All Programs</button>
            <button class="btn btn-sm btn-outline-secondary rounded-pill px-3 fw-semibold" id="filterEligible" onclick="filterActivities('eligible')">My Course Only</button>
        </div>

        <!-- Activities Feed Container -->
        <div id="activitiesContainer">
            <div class="text-center text-muted py-4 student-action-card">
                <div class="spinner-border text-primary spinner-border-sm mb-2" role="status"></div>
                <small class="d-block">Loading activities list...</small>
            </div>
        </div>
    </div>

    <!-- Fixed Bottom App Navigation -->
    <nav class="student-bottom-nav">
        <a href="/student_dashboard.html" class="student-nav-item">
            <i class="bi bi-house-door"></i>
            <span>Home</span>
        </a>
        <a href="/student_activities.html" class="student-nav-item active">
            <i class="bi bi-calendar-week-fill"></i>
            <span>Activities</span>
        </a>
        <a href="/student_attendance.html" class="student-nav-item">
            <i class="bi bi-clock"></i>
            <span>Attendance</span>
        </a>
        <a href="/student_profile.html" class="student-nav-item">
            <i class="bi bi-person"></i>
            <span>Profile</span>
        </a>
    </nav>
</div>

<!-- Schedule Conflict Error Pop-Up Modal -->
<div class="modal fade" id="conflictModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered px-3">
        <div class="modal-content border-0 shadow-lg rounded-4 text-center p-3">
            <div class="modal-body">
                <div class="text-danger mb-3">
                    <i class="bi bi-calendar-x-fill display-3"></i>
                </div>
                <h5 class="fw-bold text-dark mb-2">Schedule Conflict</h5>
                <p class="text-muted small mb-4" id="conflictModalMessage">You are already registered for another activity on this date.</p>
                <button type="button" class="btn btn-danger fw-bold px-4 py-2 rounded-pill w-100" data-bs-dismiss="modal">
                    Understand & Close
                </button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
let allActivities = [];
let currentFilter = 'all';

async function loadActivities() {
    try {
        const response = await fetch('/api/student/activities');
        if (response.status === 401) {
            window.location.href = '/index.html';
            return;
        }

        const data = await response.json();
        if (!data.success) return;

        allActivities = data.activities || [];
        renderActivities();
    } catch (err) {
        console.error('Failed to load activities:', err);
    }
}

function renderActivities() {
    const container = document.getElementById('activitiesContainer');
    
    let list = allActivities;
    if (currentFilter === 'eligible') {
        list = allActivities.filter(a => a.is_eligible);
    }

    if (list.length === 0) {
        container.innerHTML = `
            <div class="text-center text-muted py-4 student-action-card">
                <i class="bi bi-calendar-x display-6 text-muted mb-2 d-block"></i>
                <small>No activities matching your filter criteria.</small>
            </div>
        `;
        return;
    }

    container.innerHTML = list.map(act => {
        const formattedDate = act.target_date ? new Date(act.target_date).toISOString().split('T')[0] : 'N/A';

        let actionBtn = '';
        if (act.is_joined) {
            actionBtn = `
                <button onclick="toggleJoin(${act.activity_id}, 'leave')" class="btn btn-sm btn-outline-danger fw-bold py-1 px-3" style="font-size: 0.75rem;">
                    <i class="bi bi-x-circle me-1"></i> Leave Activity
                </button>
            `;
        } else if (act.is_eligible) {
            actionBtn = `
                <button onclick="toggleJoin(${act.activity_id}, 'join')" class="btn btn-sm btn-primary fw-bold py-1 px-3" style="font-size: 0.75rem;">
                    <i class="bi bi-plus-circle me-1"></i> Join Activity
                </button>
            `;
        } else {
            actionBtn = `
                <button class="btn btn-sm btn-secondary fw-semibold py-1 px-3 disabled" style="font-size: 0.75rem;">
                    Restricted (${act.target_course})
                </button>
            `;
        }

        return `
            <div class="student-action-card mb-3">
                <div class="d-flex justify-content-between align-items-start mb-2">
                    <div>
                        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary border-opacity-25 mb-1" style="font-size: 0.65rem;">
                            Target: ${act.target_course || 'All Courses'}
                        </span>
                        <h6 class="fw-bold text-dark mb-0">${act.title}</h6>
                    </div>
                </div>
                
                <p class="text-muted small mb-2" style="font-size: 0.8rem;">${act.description || 'No description provided.'}</p>
                
                <div class="bg-light p-2 rounded mb-2 d-flex justify-content-between text-muted" style="font-size: 0.72rem;">
                    <span><i class="bi bi-geo-alt-fill text-danger me-1"></i>${act.location || 'Vinzons'}</span>
                    <span><i class="bi bi-calendar-event text-primary me-1"></i>${formattedDate}</span>
                    <span><i class="bi bi-clock text-warning me-1"></i>${act.estimated_hours || 0} hrs</span>
                </div>

                <div class="d-flex justify-content-between align-items-center pt-2 border-top">
                    <small class="text-muted" style="font-size: 0.7rem;">Max Capacity: <strong>${act.max_volunteers || 20} slots</strong></small>
                    ${actionBtn}
                </div>
            </div>
        `;
    }).join('');
}

// Fixed Toggle Join Handler with Schedule Conflict Pop-Up Modal
async function toggleJoin(activityId, action) {
    try {
        const res = await fetch('/api/student/activities/join', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ activity_id: activityId, action: action })
        });

        const data = await res.json();

        if (!res.ok) {
            // Display Schedule Conflict Pop-Up
            showConflictModal(data.error || 'Failed to process registration request.');
            return;
        }

        showAlert('success', data.message || 'Operation successful!');
        loadActivities(); // Refresh activities view
    } catch (err) {
        console.error('Toggle Join Error:', err);
        showConflictModal('Server connection failure. Please try again.');
    }
}

function showConflictModal(message) {
    document.getElementById('conflictModalMessage').textContent = message;
    const modalEl = document.getElementById('conflictModal');
    const modal = new bootstrap.Modal(modalEl);
    modal.show();
}

function filterActivities(type) {
    currentFilter = type;
    document.getElementById('filterAll').className = `btn btn-sm rounded-pill px-3 fw-bold ${type === 'all' ? 'btn-primary' : 'btn-outline-secondary'}`;
    document.getElementById('filterEligible').className = `btn btn-sm rounded-pill px-3 fw-bold ${type === 'eligible' ? 'btn-primary' : 'btn-outline-secondary'}`;
    renderActivities();
}

function showAlert(type, msg) {
    document.getElementById('alertContainer').innerHTML = `
        <div class="alert alert-${type} alert-dismissible fade show py-2 px-3 small mb-3" role="alert">
            <i class="bi ${type === 'success' ? 'bi-check-circle-fill' : 'bi-exclamation-triangle-fill'} me-1"></i>${msg}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
        </div>
    `;
}

document.addEventListener('DOMContentLoaded', loadActivities);
</script>
</body>
</html>
