<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>My Profile & Certificates - CollabNet</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5 CSS & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Custom Theme CSS -->
    <link href="/assets/css/collabnet-theme.css" rel="stylesheet">
</head>
<body class="bg-secondary bg-opacity-10">

<div class="student-mobile-frame">
    <!-- Mobile App Header -->
    <div class="student-mobile-header text-center pt-4 pb-4">
        <div class="bg-white text-primary rounded-circle d-inline-flex align-items-center justify-content-center mb-2 shadow-sm" style="width: 64px; height: 64px;">
            <i class="bi bi-person-fill fs-1"></i>
        </div>
        <h5 id="profileName" class="fw-bold mb-0 text-white">Loading...</h5>
        <small id="profileCourseHeader" class="text-white-50" style="font-size: 0.75rem;">OLLCF Student</small>
    </div>

    <!-- Main Content Area -->
    <div class="p-3">
        <!-- Status Card -->
        <div class="student-action-card mb-3">
            <div class="d-flex justify-content-between align-items-center mb-2">
                <span class="text-muted small">Account Status</span>
                <span id="accountStatusBadge" class="cn-badge cn-badge-warning">
                    <i class="bi bi-clock-history me-1"></i>Pending Verification
                </span>
            </div>
            <div class="row text-center pt-2 border-top g-2">
                <div class="col-4 border-end">
                    <div id="statTotalHours" class="fw-bold fs-6 text-primary">0.00</div>
                    <small class="text-muted d-block" style="font-size: 0.65rem;">Hours Rendered</small>
                </div>
                <div class="col-4 border-end">
                    <div id="statJoinedCount" class="fw-bold fs-6 text-dark">0</div>
                    <small class="text-muted d-block" style="font-size: 0.65rem;">Activities Joined</small>
                </div>
                <div class="col-4">
                    <div id="statCertsCount" class="fw-bold fs-6 text-success">0</div>
                    <small class="text-muted d-block" style="font-size: 0.65rem;">Certificates</small>
                </div>
            </div>
        </div>

        <!-- Academic Information Card -->
        <div class="student-action-card mb-3">
            <h6 class="fw-bold mb-3 text-dark border-bottom pb-2">
                <i class="bi bi-mortarboard-fill me-2 text-primary"></i>Academic Details
            </h6>
            <div class="mb-2">
                <small class="text-muted d-block" style="font-size: 0.7rem;">STUDENT ID NUMBER</small>
                <span id="infoStudentId" class="fw-semibold text-dark" style="font-size: 0.85rem;">--</span>
            </div>
            <div class="mb-2">
                <small class="text-muted d-block" style="font-size: 0.7rem;">COURSE / PROGRAM</small>
                <span id="infoCourse" class="fw-semibold text-dark" style="font-size: 0.85rem;">--</span>
            </div>
            <div class="mb-0">
                <small class="text-muted d-block" style="font-size: 0.7rem;">OLLCF EMAIL ADDRESS</small>
                <span id="infoEmail" class="fw-semibold text-dark" style="font-size: 0.85rem;">--</span>
            </div>
        </div>

        <!-- Earned Certificates Gallery Card -->
        <div class="student-action-card mb-3">
            <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-2">
                <h6 class="fw-bold mb-0 text-dark">
                    <i class="bi bi-patch-check-fill me-2 text-success"></i>Achieved Certificates
                </h6>
                <span id="galleryCountBadge" class="badge bg-success bg-opacity-10 text-success border border-success border-opacity-25" style="font-size: 0.7rem;">
                    0 Certificates
                </span>
            </div>

            <!-- Certificates Feed Container -->
            <div id="certificatesGalleryContainer">
                <div class="text-center text-muted py-3">
                    <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                    <small>Loading certificate gallery...</small>
                </div>
            </div>
        </div>

        <!-- Account Actions Card -->
        <div class="student-action-card mb-3">
            <button id="logoutBtn" class="btn btn-outline-danger w-100 fw-bold py-2" style="font-size: 0.85rem;">
                <i class="bi bi-box-arrow-right me-1"></i> Sign Out Account
            </button>
        </div>
    </div>

    <!-- Fixed Bottom App Navigation -->
    <nav class="student-bottom-nav">
        <a href="/student_dashboard.html" class="student-nav-item">
            <i class="bi bi-house-door"></i>
            <span>Home</span>
        </a>
        <a href="/student_activities.html" class="student-nav-item">
            <i class="bi bi-calendar-week"></i>
            <span>Activities</span>
        </a>
        <a href="/student_attendance.html" class="student-nav-item">
            <i class="bi bi-clock"></i>
            <span>Attendance</span>
        </a>
        <a href="/student_profile.html" class="student-nav-item active">
            <i class="bi bi-person-fill"></i>
            <span>Profile</span>
        </a>
    </nav>
</div>

<script>
async function loadProfile() {
    const token = localStorage.getItem('token');
    if (!token) {
        window.location.href = '/index.html';
        return;
    }

    try {
        const res = await fetch('/api/student/profile', {
            headers: { 
                'Authorization': `Bearer ${token}` 
            }
        });

        if (res.status === 401 || res.status === 403) {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            window.location.href = '/index.html';
            return;
        }

        const data = await res.json();
        if (!data.success) return;

        const { profile, stats, certificates } = data;

        // Populate Header & Academic Info
        document.getElementById('profileName').textContent = profile.fullName;
        document.getElementById('profileCourseHeader').textContent = profile.course || 'OLLCF Student';
        
        document.getElementById('infoStudentId').textContent = profile.studentId || 'Not set';
        document.getElementById('infoCourse').textContent = profile.course || 'Not set';
        document.getElementById('infoEmail').textContent = profile.email;

        // Populate Metrics
        document.getElementById('statTotalHours').textContent = parseFloat(stats.totalHours || 0).toFixed(2);
        document.getElementById('statJoinedCount').textContent = stats.joinedCount || 0;
        document.getElementById('statCertsCount').textContent = stats.earnedCertificatesCount || (certificates ? certificates.length : 0);

        // Verification Badge Status
        const badgeEl = document.getElementById('accountStatusBadge');
        if (profile.verificationStatus === 'Approved') {
            badgeEl.className = 'cn-badge cn-badge-success';
            badgeEl.innerHTML = '<i class="bi bi-patch-check-fill me-1"></i>Verified Student';
        } else {
            badgeEl.className = 'cn-badge cn-badge-warning';
            badgeEl.innerHTML = '<i class="bi bi-clock-history me-1"></i>Pending Verification';
        }

        // Render Earned Certificates Gallery
        const galleryContainer = document.getElementById('certificatesGalleryContainer');
        const galleryBadge = document.getElementById('galleryCountBadge');

        if (!certificates || certificates.length === 0) {
            galleryBadge.textContent = '0 Certificates';
            galleryContainer.innerHTML = `
                <div class="text-center text-muted py-3">
                    <i class="bi bi-award display-6 text-muted mb-2 d-block opacity-50"></i>
                    <small class="d-block">No certificates earned yet.</small>
                    <small class="text-muted" style="font-size: 0.7rem;">Complete outreach target hours to unlock official certificates.</small>
                </div>
            `;
            return;
        }

        galleryBadge.textContent = `${certificates.length} Certificate${certificates.length > 1 ? 's' : ''}`;

        galleryContainer.innerHTML = certificates.map(cert => `
            <div class="border rounded-3 p-2 mb-2 bg-light d-flex justify-content-between align-items-center">
                <div class="me-2 text-truncate">
                    <strong class="d-block text-dark text-truncate" style="font-size: 0.8rem;">${cert.activityTitle}</strong>
                    <small class="text-success d-block" style="font-size: 0.7rem;">
                        <i class="bi bi-check-circle-fill me-1"></i>${cert.hoursRendered.toFixed(2)} Service Hours
                    </small>
                    <small class="text-muted font-monospace" style="font-size: 0.65rem;">${cert.certNo}</small>
                </div>
                <button onclick="downloadCertificate('${cert.participantId}', '${cert.certNo}')" 
                        class="btn btn-sm btn-primary fw-bold text-nowrap px-3 py-1" style="font-size: 0.72rem;">
                    <i class="bi bi-download me-1"></i> PDF
                </button>
            </div>
        `).join('');

    } catch (err) {
        console.error('Failed to load profile:', err);
    }
}

// Download Certificate PDF Helper
async function downloadCertificate(participantId, certNo) {
    const token = localStorage.getItem('token');
    try {
        const response = await fetch(`/api/student/certificate/download/${participantId}`, {
            headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
            alert('Unable to download certificate PDF.');
            return;
        }

        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `Certificate_${certNo || participantId}.pdf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
    } catch (err) {
        console.error('Download Certificate Error:', err);
        alert('Server error downloading certificate.');
    }
}

// Handle Logout
document.getElementById('logoutBtn').addEventListener('click', () => {
    localStorage.removeItem('token');
    localStorage.removeItem('user');
    window.location.href = '/index.html';
});

document.addEventListener('DOMContentLoaded', loadProfile);
</script>
</body>
</html>
